  <div class="cta">
    <h3>{{ctaH}}</h3>
    <p>{{ctaP}}</p>
    <a class="btn" href="{{ctaHref}}" data-goatcounter-click="{{slug}}-next-{{lang}}"><svg class="i"><use href="#i-arrow"/></svg>{{ctaBtn}}</a>
    <p class="print-only">halilneed.agency{{ctaHref}}</p>
  </div>

  <div class="share">
    <a class="btn ghost" href="{{pdf}}" data-goatcounter-click="{{slug}}-pdf-{{lang}}"><svg class="i"><use href="#i-download"/></svg>{{pdfBtn}}</a>
    <a class="btn ghost" id="shareX" target="_blank" rel="noopener" data-goatcounter-click="{{slug}}-share-x-{{lang}}"><svg class="i"><use href="#i-share"/></svg>{{shareX}}</a>
    <a class="btn ghost" id="shareLi" target="_blank" rel="noopener" data-goatcounter-click="{{slug}}-share-li-{{lang}}"><svg class="i"><use href="#i-share"/></svg>{{shareLi}}</a>
    <button class="btn ghost" id="copyLink"><svg class="i"><use href="#i-link"/></svg><span>{{copy}}</span></button>
  </div>
