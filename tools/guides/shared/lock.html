<section class="step" id="s@N@" hidden aria-labelledby="h@N@s">
  <div class="shead">
    <span class="kicker">{{kicker:@N@}}</span>
    <h2 id="h@N@s">{{s@N@h}}</h2>
    <p>{{s@N@p}}</p>
  </div>

  <div class="panel lock@DUP@">
    <div class="lock-ic"><svg class="i"><use href="#i-lock"/></svg></div>
    <h3>{{lockH}}</h3>
    <p class="lock-p">{{lockP}}</p>
    <ul class="lock-list">
      <li><svg class="i"><use href="#i-check"/></svg>{{kicker:3}}: {{s3h}}</li>
      <li><svg class="i"><use href="#i-check"/></svg>{{kicker:4}}: {{s4h}}</li>
      <li><svg class="i"><use href="#i-check"/></svg>{{lockPdf}}</li>
    </ul>
    <a class="btn lock-btn" href="{{gumroad}}?utm_source=halilneed.agency&amp;utm_medium=guide&amp;utm_campaign={{slug}}&amp;utm_content=s@N@-{{lang}}" target="_blank" rel="noopener" data-goatcounter-click="{{slug}}-gumroad-s@N@-{{lang}}"><svg class="i"><use href="#i-download"/></svg>{{lockBtn}}</a>
    <p class="fine">{{lockSmall}} <a href="{{lockMailHref}}" data-goatcounter-click="{{slug}}-request-mail-s@N@-{{lang}}">halil@halilneed.agency</a></p>
    <p class="print-only print-url">{{lockPrint}} <b>{{gumroadShort}}</b></p>
  </div>
@END@
  <div class="pager"><button class="btn ghost" data-go="@PREV@"><svg class="i"><use href="#i-back"/></svg>{{back}}</button>@NEXT@</div>
</section>
