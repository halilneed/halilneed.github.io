<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<link rel="canonical" href="{{url}}">
<link rel="alternate" hreflang="en" href="{{urlEn}}">
<link rel="alternate" hreflang="tr" href="{{urlTr}}">
<link rel="alternate" hreflang="x-default" href="{{urlEn}}">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/instrument-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<meta name="author" content="Halil">
<meta property="og:type" content="website">
<meta property="og:site_name" content="halilneed">
<meta property="og:locale" content="{{locale}}">
<meta property="og:title" content="{{name}}">
<meta property="og:description" content="{{ogDesc}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="https://halilneed.agency/assets/img/og-guides.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{name}}">
<meta name="twitter:description" content="{{ogDesc}}">
<meta name="twitter:image" content="https://halilneed.agency/assets/img/og-guides.png">
<script type="application/ld+json">
{{jsonld}}
</script>
<!-- Generated by tools/guides/build.mjs from tools/guides/{{slug}}/ and tools/guides/shared/. Edit those, not this file. -->
<style>
{{css}}
</style>
</head>
<body>

{{icons}}

<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><i>h</i>halilneed</a>
    <nav aria-label="{{guidesName}}">
      <a href="{{guidesPath}}">{{allGuides}}</a>
      <a href="{{pdf}}" data-goatcounter-click="{{slug}}-pdf-top-{{lang}}">PDF</a>
      <span class="sep" aria-hidden="true"></span>
      <a href="{{altPath}}" lang="{{altLang}}" hreflang="{{altLang}}">{{altLabel}}</a>
    </nav>
  </div>
</header>

<div class="wrap hero">
  <span class="chip"><span class="dot"></span>{{chip}}</span>
  <h1>{{h1}}</h1>
  <p>{{heroP}}</p>
  <p class="print-only print-url">{{printNote}} <b>{{urlShort}}</b></p>
</div>

<div class="stepbar">
  <div class="wrap">
    <nav class="seg" aria-label="{{stepsAria}}">
      <span class="thumb" aria-hidden="true"></span>
      <button data-go="1" aria-current="step"><svg class="i"><use href="#i-{{tabIcon1}}"/></svg><span class="t">{{tab1}}</span><span class="ck"></span></button>
      <button data-go="2"><svg class="i"><use href="#i-{{tabIcon2}}"/></svg><span class="t">{{tab2}}</span><span class="ck"></span></button>
      <button data-go="3"><svg class="i"><use href="#i-{{tabIcon3}}"/></svg><span class="t">{{tab3}}</span><span class="ck"></span></button>
      <button data-go="4"><svg class="i"><use href="#i-{{tabIcon4}}"/></svg><span class="t">{{tab4}}</span><span class="ck"></span></button>
    </nav>
  </div>
</div>

<main class="wrap">
{{body}}
</main>

<footer>© 2026 Halil, <a href="/">halilneed.agency</a>. {{footer}}</footer>

<script>
(function(){
  const L={{js}};
  const LANG=document.documentElement.lang;
  const icon=id=>'<svg class="i" aria-hidden="true"><use href="#i-'+id+'"/></svg>';
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const fmt=(s,n)=>String(s).replace("{n}",n);
  const $=id=>document.getElementById(id);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const onPrint=[];

  /* navigation */
  const done=new Set(), thumb=document.querySelector(".seg .thumb");
  function go(n,scroll){
    n=String(n);
    document.querySelectorAll("section.step").forEach(s=>s.hidden=s.id!=="s"+n);
    document.querySelectorAll(".seg button").forEach(b=>{
      const k=b.dataset.go;
      if(k===n) b.setAttribute("aria-current","step"); else b.removeAttribute("aria-current");
      b.classList.toggle("done",done.has(k)&&k!==n);
    });
    thumb.style.transform="translateX("+((+n-1)*100)+"%)";
    if(scroll!==false){
      const y=document.querySelector(".stepbar").getBoundingClientRect().top+scrollY;
      window.scrollTo({top:y,behavior:reduce?"auto":"smooth"});
      const h=document.querySelector("#s"+n+" h2"); h.setAttribute("tabindex","-1"); h.focus({preventScroll:true});
    }
    try{history.replaceState(null,"","#step-"+n)}catch(e){}
  }
  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{
    const cur=document.querySelector("section.step:not([hidden])").id.slice(1);
    if(+b.dataset.go>+cur) done.add(cur);
    go(b.dataset.go);
  }));
  const m=location.hash.match(/(?:step|adim)-([1-4])/); if(m) go(m[1],false);

  /* a group of pill buttons where exactly one is pressed */
  function pills(el,items,onPick,start){
    el.innerHTML=items.map((it,i)=>'<button class="pill" data-i="'+i+'" aria-pressed="false">'+(it.icon?icon(it.icon):"")+esc(it.label)+"</button>").join("");
    const pick=i=>{el.querySelectorAll(".pill").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.i===i)));onPick(i);};
    el.querySelectorAll(".pill").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
    if(start!=null) pick(start);
    return pick;
  }

/* ---- guide ---- */
{{script}}
/* ---- end guide ---- */

  /* print: every step on its own page, experiments in their final state */
  const preparePrint=()=>onPrint.forEach(f=>f());
  window.addEventListener("beforeprint",preparePrint);
  if(/[?&]print\b/.test(location.search)) preparePrint();

  /* share */
  const url=location.origin==="https://halilneed.agency"?location.href.split("#")[0]:"{{url}}";
  $("shareX").href="https://twitter.com/intent/tweet?text="+encodeURIComponent(L.shareText)+"&url="+encodeURIComponent(url);
  $("shareLi").href="https://www.linkedin.com/sharing/share-offsite/?url="+encodeURIComponent(url);
  $("copyLink").onclick=async()=>{
    const sp=document.querySelector("#copyLink span");
    try{await navigator.clipboard.writeText(url);sp.textContent=L.copied;}catch(e){sp.textContent=L.copyFail;}
  };
})();
</script>
<script data-goatcounter="https://hailneed.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
